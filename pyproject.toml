[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lmsluice"
# Read from `lmsluice/__init__.py`, which already declares it and is what
# `lmsluice --version` prints. Two literals would drift, and the first
# build of this file proved it: the wheel said 0.1.0 and the CLI 0.2.0.
dynamic = ["version"]
description = "Decide, per machine, whether decoding a model archive beats reading a plain file — and then do the faster one"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["llm", "model-loading", "compression", "safetensors", "inference"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Archiving :: Compression",
]

# Deliberately empty, and it is the point rather than an oversight. On the
# machines this is for -- a phone, an iGPU laptop, a box with no CUDA -- `pip
# install` is frequently the whole obstacle, and every comparable tool needs a
# tensor framework before it will import. A test walks the package source to
# keep it that way.
dependencies = []

[project.optional-dependencies]
# Better ratios and a GPU decoder. Without it the stdlib codec still works.
lmz = ["lmzip>=1.3.0"]
# Only for Python 3.10-3.13. `compression.zstd` is in the standard library from
# 3.14, which is where the no-dependency promise comes from; below that the
# codec falls back to deflate, which works and compresses less well. This extra
# buys the ratio back for one small wheel. Same bargain as lmz's `zstd` extra.
zstd = ["zstandard>=0.21"]
# `lmsluice.torchadapter`, the only module that imports torch.
torch = ["torch>=2.0"]
# A fallback for a platform where OpenSSL's libcrypto cannot be reached by
# ctypes. Encryption needs nothing installed on Linux, macOS and Windows, where
# `import ssl` has already loaded the library -- this exists so that a platform
# where that is not true is a `pip install lmsluice[crypt]` rather than a
# missing feature. `lmsluice doctor` names whichever backend is live.
crypt = ["cryptography>=42"]
# Object storage needs none of these: S3, GCS and Azure Blob are read by
# signing an HTTPS range GET with `hmac` and `hashlib` (see `lmsluice/sign.py`),
# and a test walks the source to keep it that way. The SDKs are here only for
# credential *sources* the standard library cannot reach -- instance-metadata
# and IAM roles, service-account JWTs needing RS256, managed identity -- and
# the request is still signed and sent by this package either way.
s3 = ["boto3>=1.34"]
gcs = ["google-auth>=2.0"]
azure = ["azure-identity>=1.15"]
# Nothing to install: the CUDA path talks to the driver API through ctypes and
# imports no CUDA package at all. The extra exists so that anyone who types it
# out of habit gets a working install rather than an error, and so this comment
# has somewhere to live.
cuda = []
all = ["lmzip>=1.3.0", "torch>=2.0", "cryptography>=42", "boto3>=1.34",
       "zstandard>=0.21",
       "google-auth>=2.0", "azure-identity>=1.15"]

[project.scripts]
lmsluice = "lmsluice.cli:main"

# How vLLM finds the loader. vLLM imports every `vllm.general_plugins` entry
# point at startup, and importing `lmsluice.vllmloader` is what runs its
# `@register_model_loader("lmsluice")` -- so installing this package adds
# `--load-format lmsluice` to a vLLM that was never told about it, and
# uninstalling removes it. The `--load-format-plugin` RFC that would have made
# this a flag was closed as not planned.
[project.entry-points."vllm.general_plugins"]
lmsluice = "lmsluice.vllmloader:register"

[project.urls]
Homepage = "https://github.com/FanxinSun/lmsluice"
Repository = "https://github.com/FanxinSun/lmsluice"
Documentation = "https://github.com/FanxinSun/lmsluice/blob/master/README.md"
Issues = "https://github.com/FanxinSun/lmsluice/issues"

[tool.setuptools]
packages = ["lmsluice"]

[tool.setuptools.dynamic]
version = {attr = "lmsluice.__version__"}

[tool.setuptools.package-data]
# The device-decode merge kernel and its prebuilt PTX. `merge.cu` is a
# registered loan (see docs/boundary.md); shipping the PTX means a machine with
# a driver but no nvcc still gets the device path.
lmsluice = ["*.cu", "*.ptx"]
